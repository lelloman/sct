[package]
name = "sct-archive"
description = "Standalone ScT optical archive inspection and recovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sct-protocol.workspace = true
simple-server = { workspace = true, features = ["database-sqlite"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { workspace = true, features = ["fs", "io-util"] }
rustix = { version = "1.1", features = ["fs"] }

[lints]
workspace = true

[[bin]]
name = "sct-recover"
path = "src/main.rs"
