[package]
name = "sct-server"
description = "ScT HTTP server and runtime wiring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sct-core.workspace = true
sct-protocol.workspace = true
uuid = { version = "1.26.0", features = ["v4"] }
simple-server = { workspace = true, features = ["response-headers", "task-drivers", "engine-web", "engine-tracing", "correlation-core", "oidc"] }
tracing = "0.1"
serde.workspace = true
futures-util = "0.3"
serde_json.workspace = true
toml = "0.9"

url = "2"

[dev-dependencies]
openidconnect = { version = "4.0.1", default-features = false, features = [] }
reqwest = { workspace = true, features = ["json", "stream"] }
tokio = { workspace = true, features = ["fs", "io-util", "time", "sync", "process"] }
tokio-util = { version = "0.7", features = ["compat"] }
sha2.workspace = true
chrono = "0.4"
base64 = "0.22"
sct-client.workspace = true

[lints]
workspace = true
