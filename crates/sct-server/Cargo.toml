[package]
name = "sct-server"
description = "ScT HTTP server and runtime wiring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sct-core.workspace = true
sct-protocol.workspace = true
uuid = { version = "1.26.0", features = ["v4"] }
simple-server = { workspace = true, features = ["response-headers", "task-scheduling", "static-files"] }
tracing = "0.1"
tokio.workspace = true
serde.workspace = true
futures-util = "0.3"
serde_json.workspace = true
toml = "0.9"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { workspace = true, features = ["json"] }

[dev-dependencies]
sqlx.workspace = true
sha2.workspace = true
chrono = "0.4"
base64 = "0.22"
sct-client.workspace = true

[lints]
workspace = true
