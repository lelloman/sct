[package]
name = "sct-protocol"
description = "Public protocol contracts for ScT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = { version = "1.2.2", optional = true }
# Serde conversion attributes are covered by explicit TS scalar overrides and fixtures.
ts-rs = { version = "12.0.1", optional = true, features = ["no-serde-warnings"] }

[features]
codegen = ["dep:schemars", "dep:ts-rs"]

[[bin]]
name = "sct-contracts"
required-features = ["codegen"]

[lints]
workspace = true
