[package]
name = "sct-core"
description = "ScT application operations, catalog and storage coordination"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
simple-server = { workspace = true, features = ["task-policy-core", "database-migrations", "engine-lifecycle", "engine-tasks", "engine-io", "postgres-client", "client", "process"] }
hex = "0.4"
sct-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2.workspace = true
hmac = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
quick-xml = { version = "0.38", features = ["serialize"] }
rustix = { version = "1.1", features = ["fs"] }


url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "time", "sync", "process"] }
tokio-util = { version = "0.7", features = ["compat"] }
sct-archive = { path = "../sct-archive" }

[lints]
workspace = true
