# M2 local payload example. Create this private directory before startup.
bind = "127.0.0.1:8080"
public_url = "http://127.0.0.1:8080"
web_dir = "web/dist"
checkpoint_dir = "checkpoints"
database_url_env = "SCT_DATABASE_URL"
development = true
enable_test_adapter = false
workers = 4
session_expiry_seconds = 86400

# Human login is optional; local recovery works without OIDC.
# [oidc]
# issuer = "https://auth.example.com"
# client_id = "sct"
# client_secret_env = "SCT_OIDC_CLIENT_SECRET"

[[pools]]
id = "development_pool"
capacity_bytes = 10000000000
# Reserve overhead for catalog, directory/tombstone metadata and allocation units.
overhead_bytes = 100000000
staging_bytes = 1000000000

[[backends]]
pool_id = "development_pool"
[backends.settings]
directory = "/var/lib/sct/objects"
headroom_bytes = 100000000
[backends.inspection]
id = "development_backend"
display_name = "Local storage"
adapter_kind = "local"
observed_health = "unknown"
[backends.inspection.hints]
# Hints are optional and never reorder reads.
